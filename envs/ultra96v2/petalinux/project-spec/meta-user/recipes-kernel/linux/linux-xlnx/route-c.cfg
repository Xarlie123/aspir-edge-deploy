# ---------------------------------------------------------------------------
# Kernel config fragment merged into linux-xlnx via the bbappend.
#
# Phase B additions:
#   * INA2XX hwmon driver — exposes the on-board INA226 power-monitor under
#     /sys/class/hwmon/hwmonN/{curr1_input,power1_input,in1_input}, which is
#     what the ASPIR EnergyAnalyzer scrapes for per-frame energy figures.
#     The IIO variant (CONFIG_INA2XX_ADC) is left as is.
# ---------------------------------------------------------------------------
CONFIG_SENSORS_INA2XX=y

# ---------------------------------------------------------------------------
# FPGA Manager + region (so zocl can program the PL out of an xclbin's
# BITSTREAM section at first Runner.create_runner() — no manual fpgautil
# step required after Phase C completes). Avnet's u96v2_sbc_base BSP for
# 2022.2 enables these by default; pinned here belt-and-suspenders.
# ---------------------------------------------------------------------------
CONFIG_FPGA=y
CONFIG_FPGA_MGR_ZYNQMP_FPGA=y
CONFIG_FPGA_REGION=y
CONFIG_OF_FPGA_REGION=y

# ---------------------------------------------------------------------------
# Route C: the DPUCZDX8G kernel driver (drivers/staging/apf/dpu.c). It binds
# to the device-tree node compatible "xlnx,dpuczdx8g-4.1" and creates
# /dev/dpu — the chardev VART's vivado-flow dpu-controller opens.
# CONFIG_XILINX_APF (xlnk) is a *different* driver (/dev/xlnk) and does NOT
# cover the DPU. Without CONFIG_XILINX_DPU the platform device
# 8f000000.dpuczdx8g comes up with no driver bound and /dev/dpu never appears.
# ---------------------------------------------------------------------------
CONFIG_XILINX_DPU=y

# ---------------------------------------------------------------------------
# Route C: pin the ZynqMP gigabit-transceiver PHY driver. Enabling
# CONFIG_XILINX_DPU triggered a kconfig recompute that dropped
# CONFIG_PHY_XILINX_ZYNQMP (and the GENERIC_PHY framework it selects),
# since neither was pinned. Without the psgtr PHY the dwc3 USB controller
# defers probe forever (silently — no dmesg) → no xHCI, no USB host, no
# eth0. The U96v2's network is a USB-Ethernet dongle on the USB host port,
# so this also kills networking. Pin both explicitly.
# ---------------------------------------------------------------------------
CONFIG_GENERIC_PHY=y
CONFIG_PHY_XILINX_ZYNQMP=y

# ---------------------------------------------------------------------------
# UIO — re-asserted (the CONFIG_XILINX_DPU kconfig cascade also dropped it).
# The DPU itself does not need UIO, but PYNQ/FINN/HLS4ML-style runtimes
# (Route D) access their PL accelerators via /dev/uio*. Pinning UIO here
# keeps ONE PetaLinux image usable for Route C (DPU) and Route D (FINN/
# HLS4ML) — UIO is harmless when unused. Built-in (=y) so there is never a
# kernel/module ABI mismatch like the uio_pdrv_genirq one we hit.
# ---------------------------------------------------------------------------
CONFIG_UIO=y
CONFIG_UIO_PDRV_GENIRQ=y
