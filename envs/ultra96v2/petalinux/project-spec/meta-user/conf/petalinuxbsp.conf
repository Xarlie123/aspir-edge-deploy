# Phase B: Vitis AI 3.0 recipes live inside meta-user via two relative
# symlinks (meta-user/recipes-vitis-ai and meta-user/recipes-vai-kernel),
# both pointing into the Vitis-AI@v3.0 submodule under workspace/sources/.
# meta-user's BBFILES pattern (recipes-*/*/*.bb) auto-discovers them —
# no extra USER_LAYER entry needed.
#
# Force bitbake to use the canonical vart_3.0.bb (vitis-flow) instead of
# vart_3.0_vivado.bb. With both .bb files present in the upstream tree,
# bitbake's default lexicographic preference picks "3.0_vivado" > "3.0"
# and ignores any bbappend (which only matches vart_3.0.bb by filename).
# PREFERRED_VERSION fixes that.
PREFERRED_VERSION_vart = "3.0"
